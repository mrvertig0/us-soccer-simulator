name: US Soccer Matchday Odds & Accuracy Pipeline

on:
  schedule:
    # Runs every Sunday and Wednesday at 04:00 UTC
    - cron: '0 4 * * 0,3'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 numpy

      - name: Run Scraper & Accuracy Evaluator
        run: python scrape_schedules_and_odds.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update odds slate and accuracy tracking [skip ci]" && git push)
