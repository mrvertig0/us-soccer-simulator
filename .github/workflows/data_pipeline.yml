name: Weekly US Soccer Odds & Accuracy Pipeline

on:
  schedule:
    - cron: '0 6 * * 3' # Weekly on Wednesdays at 06:00 UTC
  workflow_dispatch: # Enables manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-update-accuracy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Run Match Scraper & Accuracy Evaluator
        run: python scrape_schedules_and_odds.py

      - name: Commit and Push Updated Odds & Accuracy Stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated odds update & model accuracy refresh [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          file_pattern: "public/data/ predictions.db"
          skip_fetch: false
          skip_checkout: false