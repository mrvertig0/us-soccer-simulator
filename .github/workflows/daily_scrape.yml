name: Daily Soccer Match Scraper & Model Grader

on:
  schedule:
    - cron: '0 11 * * *' # Runs every day at 11:00 UTC (7:00 AM EST)
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants git push access to the GITHUB_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run Scraper & Model Grader Pipeline
        run: python scrape_schedules_and_odds.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data/ predictions.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily odds and model stats refresh [skip ci]" && git pull --rebase origin main && git push origin main)