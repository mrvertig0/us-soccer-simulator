name: Daily Soccer Match Scraper & Model Grader

on:
  schedule:
    - cron: '0 11 * * *' # Runs every day at 11:00 UTC (7:00 AM EST)
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants git push access to the GITHUB_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run Scraper & Model Grader Pipeline
        run: python scrape_schedules_and_odds.py

      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated daily odds and model stats refresh [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          file_pattern: "public/data/ predictions.db"
          skip_fetch: false
          skip_checkout: false