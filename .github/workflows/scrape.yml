name: Weekly Matchday Odds Scraper

on:
  schedule:
    # Runs every Wednesday at 7:00 AM EST (12:00 UTC)
    - cron: '0 12 * * 3'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run Dynamic ESPN Scraper
        run: python scrape_schedules_and_odds.py

      - name: Commit and Push Updated Odds & Accuracy Stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated odds update & model accuracy refresh [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          file_pattern: "public/data/ predictions.db"
          skip_fetch: false
          skip_checkout: false
